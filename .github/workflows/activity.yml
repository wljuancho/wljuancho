name: Update Contribution Activity

'on':
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: wljuancho
          options: theme=github-compact&hide_border=true
          output_path: profile/activity.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit activity graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/activity.svg

          git commit -m "Update contribution activity" || exit 0

          git push
